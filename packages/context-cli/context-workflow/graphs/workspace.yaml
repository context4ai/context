schema: agent-graph.graph.v1
id: workspace
description: Fact-grounded lifecycle for a Context knowledge workspace.
entrypoints:
  context: repair-project-entry
nodes:
  - id: repair-project-entry
    kind: action
    reasonCode: route.workspace.project-entry-invalid
    action: actions/repair-project-entry.yaml
    satisfiedBy:
      - path: workspace.project_entry_valid
        equals: true
    resources:
      required:
        - resources/procedures/project-configuration.md
        - resources/manuals/reference/project-api.md
      recommended: [resources/diagnostics/workspace-state.md]

  - id: repair-workspace-state
    kind: action
    reasonCode: route.workspace.state-invalid
    action: actions/repair-workspace-state.yaml
    satisfiedBy:
      - path: workspace.state_valid
        equals: true
    resources:
      required:
        - resources/diagnostics/workspace-state.md
        - resources/views/workspace-current.yaml

  - id: repair-verification
    kind: action
    reasonCode: route.verify.failed
    action: actions/repair-verification.yaml
    satisfiedBy:
      - path: verification.blocking_clear
        equals: true
    resources:
      required:
        - resources/procedures/verify-and-repair.md
        - resources/views/verification-current.yaml
      recommended: [resources/diagnostics/verification.md]

  - id: choose-evidence-maintenance
    kind: gate
    reasonCode: route.evidence.decision-required
    resolutionAction: actions/maintain-evidence.yaml
    gate:
      id: evidence-maintenance
      prompt: Decide how to handle approved knowledge whose source evidence moved or disappeared.
      authority: context.evidence-maintenance
      delegatable: false
    satisfiedBy:
      - path: gates.evidence_maintenance_resolved
        equals: true
    resources:
      required:
        - resources/procedures/evidence-maintenance.md
        - resources/dialogue/human-gates.md
        - resources/dialogue/evidence-maintenance.md
        - resources/views/verification-current.yaml

  - id: maintain-evidence
    kind: action
    reasonCode: route.evidence.maintenance-required
    action: actions/maintain-evidence.yaml
    satisfiedBy:
      - path: evidence.maintenance_clear
        equals: true
    resources:
      required:
        - resources/procedures/evidence-maintenance.md
        - resources/views/verification-current.yaml
      recommended: [resources/diagnostics/verification.md]

  - id: close-approved-knowledge
    kind: action
    reasonCode: route.close.projection-stale
    action: actions/close-approved-knowledge.yaml
    satisfiedBy:
      - path: close.current
        equals: true
    resources:
      required:
        - resources/procedures/close-and-build.md
        - resources/views/verification-current.yaml
      recommended:
        - resources/diagnostics/projection-stale.md

  - id: revise-document
    kind: action
    reasonCode: route.document-revision.requested
    action: actions/revise-document.yaml
    satisfiedBy:
      - path: document_optimization.revision_requested
        exists: false
    resources:
      required:
        - resources/procedures/document-revision.md
        - resources/views/document-optimization-current.yaml

  - id: choose-source-boundary
    kind: gate
    reasonCode: route.source.boundary-required
    gate:
      id: source-boundary
      prompt: Choose the repositories, modules, or documents that may become knowledge sources.
      authority: context.source-boundary
      delegatable: false
    resolutionAction: actions/register-source-batch.yaml
    satisfiedBy:
      - path: sources.registered
        equals: true
    resources:
      required:
        - resources/procedures/source-boundary.md
        - resources/dialogue/human-gates.md
        - resources/dialogue/source-boundary.md
        - resources/dialogue/workflow-mode-after-creation.md
        - resources/views/source-current.yaml
      recommended:
        - resources/procedures/source-capture-detailed.md

  - id: ensure-repository-sources
    kind: gate
    reasonCode: route.source.repository-not-ready
    inspectionAction: actions/inspect-repository-recovery.yaml
    resolutionAction: actions/restore-repository-sources.yaml
    gate:
      id: repository-source-recovery
      prompt: Choose how to restore each missing registered repository checkout.
      authority: context.repository-restore
      delegatable: false
    satisfiedBy:
      - path: sources.repositories_ready
        equals: true
    resources:
      required:
        - resources/procedures/repository-source-recovery.md
        - resources/dialogue/human-gates.md
        - resources/dialogue/repository-source-recovery.md
        - resources/views/source-current.yaml

  - id: configure-document-capture
    kind: action
    reasonCode: route.capture.configuration-required
    action: actions/configure-document-capture.yaml
    satisfiedBy:
      - path: capture.declarations_complete
        equals: true
    resources:
      required:
        - resources/procedures/project-configuration.md
        - resources/manuals/reference/project-api.md
      recommended:
        - resources/procedures/document-capture.md
        - resources/views/source-current.yaml
        - resources/manuals/guides/lark-resources.md

  - id: authorize-document-capture
    kind: gate
    reasonCode: route.capture.permission-required
    gate:
      id: source-read-permission
      prompt: Allow Context to read the registered external document sources for this capture.
      authority: context.source-read
      delegatable: false
    satisfiedBy:
      - path: gates.source_read_resolved
        equals: true
    resources:
      required:
        - resources/procedures/document-capture.md
        - resources/dialogue/human-gates.md
        - resources/dialogue/document-capture.md
        - resources/views/source-current.yaml
      recommended:
        - resources/procedures/source-capture-detailed.md
        - resources/manuals/guides/lark-resources.md

  - id: capture-next
    kind: action
    reasonCode: route.capture.pending-target
    action: actions/capture-next.yaml
    satisfiedBy:
      - path: capture.complete
        equals: true
    resources:
      required:
        - resources/procedures/document-capture.md
        - resources/views/source-boundary.yaml
      recommended:
        - resources/procedures/source-capture-detailed.md
        - resources/manuals/guides/lark-resources.md

  - id: run-indexer-lifecycle
    kind: action
    reasonCode: route.indexer.lifecycle-required
    action: actions/run-indexer-lifecycle.yaml
    satisfiedBy:
      - path: indexer.lifecycle_current
        equals: true

  - id: resolve-review-identities
    kind: action
    reasonCode: route.review.identity-conflict
    action: actions/reconcile-review-identities.yaml
    satisfiedBy:
      - path: review.identity_conflicts_present
        exists: false
    resources:
      required:
        - resources/procedures/knowledge-review.md
        - resources/views/review-current.yaml

  - id: review-current-batch
    kind: gate
    reasonCode: route.review.decision-required
    inspectionAction: actions/inspect-review.yaml
    resolutionAction: actions/apply-forced-review.yaml
    delegated:
      inspection: skip
      resolutionAction: actions/apply-managed-review.yaml
      resources:
        required: []
        recommended: []
    gate:
      id: knowledge-review
      prompt: Review the complete current candidate batch before it enters approved knowledge.
      authority: context.knowledge-review
      delegatable: true
    satisfiedBy:
      - path: gates.knowledge_review_resolved
        equals: true
    resources:
      required:
        - resources/procedures/knowledge-review.md
        - resources/dialogue/human-gates.md
        - resources/dialogue/knowledge-review.md
        - resources/views/review-current.yaml

  - id: apply-managed-review
    kind: action
    reasonCode: route.review.apply-managed
    action: actions/apply-managed-review.yaml
    satisfiedBy:
      - path: review.gate_clear
        equals: true
    resources:
      required:
        - resources/procedures/knowledge-review.md
        - resources/views/review-current.yaml

  - id: choose-package-output
    kind: gate
    reasonCode: route.package.output-required
    gate:
      id: package-output
      prompt: Choose how approved knowledge should be packaged for downstream consumers.
      authority: context.package-output
      delegatable: true
    satisfiedBy:
      - path: gates.package_output_resolved
        equals: true
    resources:
      required:
        - resources/procedures/package-output.md
        - resources/dialogue/human-gates.md
        - resources/dialogue/package-output.md
        - resources/views/package-current.yaml
      recommended:
        - resources/manuals/guides/package-outputs.md
        - resources/manuals/reference/package-templates.md
        - resources/manuals/reference/template-variables.md

  - id: configure-package-output
    kind: action
    reasonCode: route.package.configuration-required
    action: actions/configure-package-output.yaml
    satisfiedBy:
      - path: packages.declared
        equals: true
    resources:
      required:
        - resources/procedures/project-configuration.md
        - resources/procedures/package-output.md
        - resources/views/package-current.yaml
      recommended:
        - resources/manuals/guides/package-outputs.md
        - resources/manuals/reference/project-api.md
        - resources/manuals/reference/package-templates.md
        - resources/manuals/reference/template-variables.md

  - id: review-package-template
    kind: gate
    reasonCode: route.package.template-review-required
    resolutionAction: actions/accept-package-templates.yaml
    delegated:
      resources:
        required: []
        recommended: []
    gate:
      id: package-template-review
      prompt: Replace or edit the declared package templates, or explicitly accept the unchanged generic defaults.
      authority: context.package-template-review
      delegatable: true
    satisfiedBy:
      - path: packages.templates_reviewed
        equals: true
    resources:
      required:
        - resources/procedures/package-output.md
        - resources/dialogue/human-gates.md
        - resources/views/package-current.yaml
        - resources/manuals/reference/package-templates.md

  - id: build-next
    kind: action
    reasonCode: route.build.package-stale
    action: actions/build-next.yaml
    satisfiedBy:
      - path: packages.current
        equals: true
    resources:
      required:
        - resources/procedures/close-and-build.md
        - resources/views/package-current.yaml

  - id: flush-logs-after-build
    kind: action
    reasonCode: route.logs.delivery-pending
    action: actions/flush-runtime-events.yaml
    satisfiedBy:
      - path: logs.final_pending
        exists: false
    resources:
      required:
        - resources/procedures/runtime-event-delivery.md

  - id: current-scope-complete
    kind: terminal
    terminalOutcome: completed

edges:
  - { from: repair-project-entry, to: repair-workspace-state }
  - { from: repair-workspace-state, to: repair-verification }
  - { from: repair-verification, to: choose-evidence-maintenance }
  - { from: choose-evidence-maintenance, to: maintain-evidence, kind: gatedBy }
  - { from: maintain-evidence, to: revise-document }
  - { from: revise-document, to: choose-source-boundary }
  - { from: choose-source-boundary, to: ensure-repository-sources, kind: gatedBy }
  - { from: ensure-repository-sources, to: configure-document-capture }
  - { from: configure-document-capture, to: authorize-document-capture }
  - { from: authorize-document-capture, to: capture-next, kind: gatedBy }
  - { from: capture-next, to: run-indexer-lifecycle }
  - { from: run-indexer-lifecycle, to: resolve-review-identities }
  - { from: resolve-review-identities, to: review-current-batch }
  - { from: review-current-batch, to: apply-managed-review, kind: gatedBy }
  - { from: apply-managed-review, to: close-approved-knowledge }
  - { from: close-approved-knowledge, to: choose-package-output }
  - { from: choose-package-output, to: configure-package-output, kind: gatedBy }
  - { from: configure-package-output, to: review-package-template }
  - { from: review-package-template, to: build-next, kind: gatedBy }
  - { from: build-next, to: flush-logs-after-build }
  - { from: flush-logs-after-build, to: current-scope-complete }
