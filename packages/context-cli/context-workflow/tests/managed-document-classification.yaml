  facts:
    workspace: { project_entry_valid: true, state_valid: true }
    verification: { blocking_clear: true }
    evidence: { maintenance_clear: true }
    close: { current: true }
    gates:
      evidence_maintenance_resolved: true
      source_read_resolved: true
      extraction_scope_resolved: true
      document_classification_resolved: false
      knowledge_review_resolved: true
    resume:
      prose_declarations_complete: true
      structure_confirmation_resolved: true
      structure_confirmed: true
      compile_complete: true
      knowledge_review_resolved: true
      review_gate_clear: true
    sources: { registered: true, repositories_ready: true }
    capture: { declarations_complete: true, complete: true }
    extract: { declarations_complete: true, complete: true }
    review: { gate_clear: true, batch_resolved: true }
    documents: { classified: false }
expect:
