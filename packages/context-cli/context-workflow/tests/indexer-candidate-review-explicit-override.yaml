schema: agent-graph.test.v1
name: the complete profile report opens a non-delegable explicit override Gate
graph: indexer
entry: candidate-review
state:
  outcomes:
    indexer/inspect-index-candidate-review-readiness: blocked
    indexer/revise-index-output: completed
    indexer/record-index-profile-revision: completed
    indexer/report-index-profile-failure: completed
  authorities: [context.indexer-profile-risk-override]
expect:
  statusCode: waiting-user
  primaryNode: override-index-profile-audit
  primaryReasonCode: route.indexer.profile-override
  availability: requires-user
  gateResolution: user
  resolutionCommand: context indexer override-index-profile-audit --input .tmp/agent-payloads/indexer-profile-override-decision.json --format json
