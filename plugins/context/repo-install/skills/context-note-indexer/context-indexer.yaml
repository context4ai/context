protocol: context.indexer.provider/v1
id: context-note-indexer
version: 1.0.0
domains:
  - markdown
activation:
  target_kinds:
    - note
    - note-set
  required_signals:
    - id: durable-note
      description: An authorized saved record, excerpt, observation or note summary is
        available.
  supporting_signals:
    - id: reader-purpose
      description: The material answers a reader question or improves existing knowledge.
  negative_signals:
    - id: unavailable-original
      description: Only a pointer to unread material exists; do not invent its content.
  agent_questions:
    - Does this material improve an existing page, justify an independent reader
      topic, or only need saving?
provides:
  profiles: &a1
    - domain-reference
    - product-requirements
    - technical-guide
    - user-and-developer-guide
    - runbook
    - faq-support
    - decision-record
    - incident-review
    - test-validation
    - note/monorepo-container
    - note/web-application
    - note/component-library
    - note/sdk-library
    - note/cli-tool
    - note/plugin-extension
    - note/api-service
    - note/gateway-facade
    - note/domain-service
    - note/background-runtime
    - note/event-consumer
    - note/data-sync-reconciliation
    - note/storage-repository
    - note/adapter-integration
    - note/contract-source
    - note/derived-generated-source
    - note/domain-reference
    - note/product-requirements
    - note/technical-guide
    - note/user-and-developer-guide
    - note/public-api-reference
    - note/runbook
    - note/faq-support
    - note/standard-policy
    - note/decision-record
    - note/incident-review
    - note/test-validation
    - note/release-migration-guide
    - note/documentation-site
  partition_strategies:
    - id: reader-subject
      profiles:
        - domain-reference
        - product-requirements
        - technical-guide
        - user-and-developer-guide
        - runbook
        - faq-support
        - decision-record
        - incident-review
        - test-validation
      priority: 100
  operations:
    - id: main-index
      consumes: context.indexer.main-workset/v2
      produces: context.indexer.main-result/v1
      accepts_layer_fragments:
        - fact-enrichment
        - template-variables
  source_roles:
    - authoritative-document
    - supporting-document
    - operational-document
    - decision-record
  logical_units:
    - id: reader-subject
      identity: canonical-subject-key
      artifacts:
        recommended:
          - content
        supported_policy_variants:
          - standard
composition:
  extensions:
    - profile: note/monorepo-container
      extends: monorepo-container
      subject_key_schema:
        version: 1
        namespace:
          operator: canonical-source-module-namespace
        kinds:
          - id: project
            local_key:
              operator: canonical-module-identity
        normalization:
          - trim
          - unicode-nfc
          - preserve-case
    - profile: note/web-application
      extends: web-application
      subject_key_schema:
        version: 1
        namespace:
          operator: canonical-source-module-namespace
        kinds:
          - id: application
            local_key:
              operator: canonical-module-identity
          - id: capability
            local_key:
              operator: canonical-export-family
        normalization:
