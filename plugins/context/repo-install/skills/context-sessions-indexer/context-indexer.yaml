protocol: context.indexer.provider/v1
id: context-sessions-indexer
version: 1.0.0
domains:
  - markdown
activation:
  target_kinds:
    - sessions
    - sessions-set
  required_signals:
    - id: durable-sessions
      description: An authorized bounded conversation summary is available; a code
        change is optional.
  supporting_signals:
    - id: reader-purpose
      description: The material answers a reader question or improves existing knowledge.
  negative_signals:
    - id: unavailable-original
      description: Only a pointer to unread material exists; do not invent its content.
  agent_questions:
    - Does this material improve an existing page, justify an independent reader
      topic, or only need saving?
provides:
  profiles: &a1
    - domain-reference
    - product-requirements
    - technical-guide
    - user-and-developer-guide
    - runbook
    - faq-support
    - decision-record
    - incident-review
    - test-validation
    - sessions/monorepo-container
    - sessions/web-application
    - sessions/component-library
    - sessions/sdk-library
    - sessions/cli-tool
    - sessions/plugin-extension
    - sessions/api-service
    - sessions/gateway-facade
    - sessions/domain-service
    - sessions/background-runtime
    - sessions/event-consumer
    - sessions/data-sync-reconciliation
    - sessions/storage-repository
    - sessions/adapter-integration
    - sessions/contract-source
    - sessions/derived-generated-source
    - sessions/domain-reference
    - sessions/product-requirements
    - sessions/technical-guide
    - sessions/user-and-developer-guide
    - sessions/public-api-reference
    - sessions/runbook
    - sessions/faq-support
    - sessions/standard-policy
    - sessions/decision-record
    - sessions/incident-review
    - sessions/test-validation
    - sessions/release-migration-guide
    - sessions/documentation-site
  partition_strategies:
    - id: reader-subject
      profiles:
        - domain-reference
        - product-requirements
        - technical-guide
        - user-and-developer-guide
        - runbook
        - faq-support
        - decision-record
        - incident-review
        - test-validation
      priority: 100
  operations:
    - id: main-index
      consumes: context.indexer.main-workset/v2
      produces: context.indexer.main-result/v1
      accepts_layer_fragments:
        - fact-enrichment
        - template-variables
  source_roles:
    - authoritative-document
    - supporting-document
    - operational-document
    - decision-record
  logical_units:
    - id: reader-subject
      identity: canonical-subject-key
      artifacts:
        recommended:
          - content
        supported_policy_variants:
          - standard
composition:
  extensions:
    - profile: sessions/monorepo-container
      extends: monorepo-container
      subject_key_schema:
        version: 1
        namespace:
          operator: canonical-source-module-namespace
        kinds:
          - id: project
            local_key:
              operator: canonical-module-identity
        normalization:
          - trim
          - unicode-nfc
          - preserve-case
    - profile: sessions/web-application
      extends: web-application
      subject_key_schema:
        version: 1
        namespace:
          operator: canonical-source-module-namespace
        kinds:
          - id: application
            local_key:
              operator: canonical-module-identity
          - id: capability
            local_key:
              operator: canonical-export-family
        normalization:
