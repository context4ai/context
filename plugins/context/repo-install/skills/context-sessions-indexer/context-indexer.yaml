      profiles: *a1
    - path: references/classification.md
      profiles: *a1
    - path: references/writing.md
      profiles: *a1
    - path: references/updates-and-composition.md
      profiles: *a1
    - path: references/extension-placement.md
      profiles:
        - sessions/monorepo-container
        - sessions/web-application
        - sessions/component-library
        - sessions/sdk-library
        - sessions/cli-tool
        - sessions/plugin-extension
        - sessions/api-service
