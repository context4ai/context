protocol: context.indexer.provider/v1
id: context-markdown-indexer
version: 1.1.3
domains:
  - markdown
activation:
  target_kinds:
    - document
    - document-set
    - documentation-site
  required_signals:
    - id: captured-document
      description: The registered target scope contains a current captured Markdown or structured document snapshot.
  supporting_signals:
    - id: explicit-audience
      description: The source identifies a reader, task, policy, decision, procedure, or reference boundary.
    - id: cross-source-evidence
      description: The readable scope contains current corroborating material for unresolved claims.
  negative_signals:
    - id: transient-conversation
      description: The material is an unapproved transient conversation without a durable source identity.
  agent_questions:
    - Which reader goal and authority apply to each source-backed Section?
provides:
  profiles:
    - domain-reference
    - product-requirements
    - technical-guide
    - user-and-developer-guide
    - public-api-reference
    - runbook
    - faq-support
    - standard-policy
    - decision-record
    - incident-review
    - test-validation
    - release-migration-guide
    - documentation-site
  partition_strategies:
    - id: reader-subject
      profiles:
        - domain-reference
        - product-requirements
        - technical-guide
        - user-and-developer-guide
        - public-api-reference
        - runbook
        - faq-support
        - standard-policy
        - decision-record
        - incident-review
        - test-validation
        - release-migration-guide
        - documentation-site
      priority: 100
  operations:
    - id: main-index
      consumes: context.indexer.main-workset/v2
      produces: context.indexer.main-result/v1
      accepts_layer_fragments:
        - fact-enrichment
        - template-variables
  source_roles:
    - authoritative-document
    - supporting-document
    - operational-document
    - decision-record
  logical_units:
    - id: reader-subject
      identity: canonical-subject-key
      artifacts:
        recommended:
          - content
        supported_policy_variants:
          - standard
provider:
  instructions:
