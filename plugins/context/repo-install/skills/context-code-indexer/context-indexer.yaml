protocol: context.indexer.provider/v1
id: context-code-indexer
version: 1.2.1
domains:
  - code
activation:
  target_kinds:
    - repository
    - package
    - library
    - service
    - application
  required_signals:
    - id: supported-source
      description: The registered target scope contains source or contract files supported by Context.
  supporting_signals:
    - id: stable-entry
      description: The target exposes a stable entry, protocol, command, route, export, or runtime boundary.
    - id: usage-material
      description: The readable scope contains examples, tests, documentation, or operational material.
  negative_signals:
    - id: generated-only
      description: The scope contains only generated artifacts with no authoritative source boundary.
  agent_questions:
    - Which stable reader capability groups the complete eligible inventory?
provides:
  profiles:
    - monorepo-container
    - web-application
    - component-library
    - sdk-library
    - cli-tool
    - plugin-extension
    - api-service
    - gateway-facade
    - domain-service
    - background-runtime
    - event-consumer
    - data-sync-reconciliation
    - storage-repository
    - adapter-integration
    - contract-source
    - derived-generated-source
  partition_strategies:
    - id: public-target-family
      profiles:
        - component-library
        - sdk-library
        - plugin-extension
        - contract-source
      priority: 100
    - id: canonical-semantic-subject
      profiles:
        - monorepo-container
        - web-application
        - component-library
        - sdk-library
        - cli-tool
        - plugin-extension
        - api-service
        - gateway-facade
        - domain-service
        - background-runtime
        - event-consumer
        - data-sync-reconciliation
        - storage-repository
        - adapter-integration
        - contract-source
        - derived-generated-source
      priority: 200
  operations:
    - id: main-index
      consumes: context.indexer.main-workset/v2
      produces: context.indexer.main-result/v1
      accepts_layer_fragments:
        - fact-enrichment
        - template-variables
  layer_fragments:
    - kind: derived-artifact-proposal
      phase: post-author
      produces: context.indexer.layer-fragment/v1
  composers:
    - id: public-contract
      supported_profiles:
        - component-library
        - sdk-library
        - cli-tool
        - plugin-extension
        - api-service
        - gateway-facade
        - domain-service
        - adapter-integration
        - contract-source
        - derived-generated-source
      contract:
        instruction: references/composers/public-contract.md
        primary_requirements:
          fact_kinds:
            - code-symbol
          artifact_kinds:
            - content
        derived_artifact_policy:
          fragment_protocol: context.indexer.layer-fragment/v1
          fragment_kind: derived-artifact-proposal
          artifact_policy_variant: standard
          artifact_kinds:
            - contract
        empty_result:
          result_protocol: context.indexer.layer-fragment-result/v1
          behavior: empty-fragment-set
    - id: protocol-boundary
      supported_profiles:
        - web-application
        - sdk-library
        - cli-tool
        - plugin-extension
        - api-service
        - gateway-facade
        - domain-service
        - background-runtime
        - event-consumer
        - data-sync-reconciliation
        - storage-repository
        - adapter-integration
        - contract-source
        - derived-generated-source
      contract:
        instruction: references/composers/protocol-boundary.md
        primary_requirements:
          fact_kinds:
            - protocol-operation
          artifact_kinds:
            - contract
        derived_artifact_policy:
          fragment_protocol: context.indexer.layer-fragment/v1
          fragment_kind: derived-artifact-proposal
          artifact_policy_variant: standard
          artifact_kinds:
            - contract
        empty_result:
          result_protocol: context.indexer.layer-fragment-result/v1
          behavior: empty-fragment-set
    - id: cross-module-chain
      supported_profiles:
        - monorepo-container
        - web-application
        - component-library
        - sdk-library
        - cli-tool
        - plugin-extension
        - api-service
        - gateway-facade
        - domain-service
        - background-runtime
        - event-consumer
        - data-sync-reconciliation
        - storage-repository
        - adapter-integration
      contract:
        instruction: references/composers/cross-module-chain.md
        primary_requirements:
          fact_kinds:
            - module-dependency
          artifact_kinds:
            - content
        derived_artifact_policy:
          fragment_protocol: context.indexer.layer-fragment/v1
          fragment_kind: derived-artifact-proposal
          artifact_policy_variant: standard
          artifact_kinds:
            - content
        empty_result:
          result_protocol: context.indexer.layer-fragment-result/v1
          behavior: empty-fragment-set
    - id: contracts-and-chains
      supported_profiles:
        - monorepo-container
        - web-application
        - component-library
        - sdk-library
        - cli-tool
        - plugin-extension
        - api-service
        - gateway-facade
        - domain-service
        - background-runtime
        - event-consumer
        - data-sync-reconciliation
        - storage-repository
        - adapter-integration
        - contract-source
        - derived-generated-source
      contract:
        instruction: references/composers/contracts-and-chains.md
        primary_requirements:
          fact_kinds:
            - contract-binding
            - module-dependency
          artifact_kinds:
            - contract
        derived_artifact_policy:
          fragment_protocol: context.indexer.layer-fragment/v1
          fragment_kind: derived-artifact-proposal
          artifact_policy_variant: standard
          artifact_kinds:
            - contract
        empty_result:
          result_protocol: context.indexer.layer-fragment-result/v1
          behavior: empty-fragment-set
    - id: event-flow
      supported_profiles:
        - web-application
        - plugin-extension
        - api-service
        - gateway-facade
        - domain-service
        - background-runtime
        - event-consumer
        - data-sync-reconciliation
        - adapter-integration
        - contract-source
      contract:
        instruction: references/composers/event-flow.md
        primary_requirements:
          fact_kinds:
            - event-binding
          artifact_kinds:
            - content
        derived_artifact_policy:
          fragment_protocol: context.indexer.layer-fragment/v1
          fragment_kind: derived-artifact-proposal
          artifact_policy_variant: standard
          artifact_kinds:
            - content
        empty_result:
          result_protocol: context.indexer.layer-fragment-result/v1
          behavior: empty-fragment-set
    - id: persistence-boundary
      supported_profiles:
        - api-service
        - gateway-facade
        - domain-service
