        - sdk-library
        - cli-tool
        - plugin-extension
        - api-service
        - gateway-facade
        - domain-service
        - background-runtime
        - event-consumer
        - data-sync-reconciliation
        - storage-repository
        - adapter-integration
        - contract-source
        - derived-generated-source
      contract:
        instruction: references/composers/examples-and-documentation.md
        primary_requirements:
          fact_kinds:
            - example-candidate
          artifact_kinds:
            - content
        derived_artifact_policy:
          fragment_protocol: context.indexer.layer-fragment/v1
          fragment_kind: derived-artifact-proposal
          artifact_policy_variant: standard
          artifact_kinds:
            - examples
        empty_result:
          result_protocol: context.indexer.layer-fragment-result/v1
          behavior: empty-fragment-set
    - id: development-and-delivery
      supported_profiles:
        - monorepo-container
        - web-application
        - component-library
        - sdk-library
        - cli-tool
        - plugin-extension
        - api-service
        - gateway-facade
        - domain-service
        - background-runtime
        - event-consumer
        - data-sync-reconciliation
        - storage-repository
        - adapter-integration
        - contract-source
        - derived-generated-source
      contract:
        instruction: references/composers/development-and-delivery.md
        primary_requirements:
          fact_kinds:
            - development-entry
          artifact_kinds:
            - content
        derived_artifact_policy:
          fragment_protocol: context.indexer.layer-fragment/v1
          fragment_kind: derived-artifact-proposal
          artifact_policy_variant: standard
          artifact_kinds:
            - content
        empty_result:
          result_protocol: context.indexer.layer-fragment-result/v1
          behavior: empty-fragment-set
  source_roles:
    - authoritative-source
    - public-contract-source
    - example-source
    - operational-source
  logical_units:
    - id: semantic-subject
      identity: canonical-subject-key
      artifacts:
        recommended:
          - content
          - contract
          - examples
        supported_policy_variants:
          - compact
          - standard
