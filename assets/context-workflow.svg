<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Context knowledge production workflow</title>
  <desc id="desc">Documents, repositories, and curated material become captured evidence, reviewed knowledge, and Agent or LLM outputs through an Agent-guided workflow.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d5d5d5" opacity=".45"/></pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#181818" flood-opacity=".075"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#ef6f2e"/></marker>
  </defs>
  <rect width="1400" height="600" fill="#faf9f7"/><rect width="1400" height="600" fill="url(#grid)"/>
  <text x="48" y="62" fill="#181818" font-family="Inter, Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="600">Knowledge moves from source evidence to reusable Agent context</text>
  <text x="48" y="92" fill="#717171" font-family="Inter, Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">The Agent makes semantic judgments; Context preserves the production contract.</text>
  <g fill="none" stroke="#ef6f2e" stroke-width="2" marker-end="url(#arrow)"><path d="M278 267H308"/><path d="M526 267H556"/><path d="M774 267H804"/><path d="M1022 267H1052"/></g>
  <g filter="url(#lift)" font-family="Inter, Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(48 150)"><rect width="230" height="234" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><rect x="1" y="1" width="228" height="5" rx="3" fill="#ef6f2e"/><text x="22" y="43" fill="#d95817" font-family="monospace" font-size="11">SOURCES</text><text x="22" y="79" fill="#181818" font-size="19" font-weight="500">Source material</text><text x="22" y="114" fill="#535353" font-size="13"><tspan x="22">Lark · Markdown</tspan><tspan x="22" dy="21">Repositories · Curated notes</tspan></text><line x1="22" y1="178" x2="208" y2="178" stroke="#e5e5e5"/><text x="22" y="207" fill="#717171" font-family="monospace" font-size="11">confirmed boundary</text></g>
    <g transform="translate(308 150)"><rect width="218" height="234" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><text x="22" y="43" fill="#717171" font-family="monospace" font-size="11">CAPTURE</text><text x="22" y="79" fill="#181818" font-size="19" font-weight="500">Evidence</text><text x="22" y="114" fill="#535353" font-size="13"><tspan x="22">Bodies, assets, symbols,</tspan><tspan x="22" dy="21">relations and fingerprints</tspan></text><line x1="22" y1="178" x2="196" y2="178" stroke="#e5e5e5"/><text x="22" y="207" fill="#717171" font-family="monospace" font-size="11">traceable snapshots</text></g>
    <g transform="translate(556 150)"><rect width="218" height="234" rx="14" fill="#fdfdfd" stroke="#ef6f2e" stroke-width="2"/><text x="22" y="43" fill="#d95817" font-family="monospace" font-size="11">AGENT WORK</text><text x="22" y="79" fill="#181818" font-size="19" font-weight="500">Structure &amp; compile</text><text x="22" y="114" fill="#535353" font-size="13"><tspan x="22">Interpret meaning, design</tspan><tspan x="22" dy="21">Nodes, draft Sections</tspan></text><line x1="22" y1="178" x2="196" y2="178" stroke="#e5e5e5"/><text x="22" y="207" fill="#d95817" font-family="monospace" font-size="11">route-selected context</text></g>
    <g transform="translate(804 150)"><rect width="218" height="234" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><text x="22" y="43" fill="#717171" font-family="monospace" font-size="11">GOVERNANCE</text><text x="22" y="79" fill="#181818" font-size="19" font-weight="500">Review &amp; verify</text><text x="22" y="114" fill="#535353" font-size="13"><tspan x="22">Confirm decisions, close</tspan><tspan x="22" dy="21">the round, check quality</tspan></text><line x1="22" y1="178" x2="196" y2="178" stroke="#e5e5e5"/><text x="22" y="207" fill="#717171" font-family="monospace" font-size="11">approved knowledge</text></g>
    <g transform="translate(1052 150)"><rect width="300" height="234" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><rect x="1" y="1" width="298" height="5" rx="3" fill="#ef6f2e"/><text x="22" y="43" fill="#d95817" font-family="monospace" font-size="11">OUTPUTS</text><text x="22" y="79" fill="#181818" font-size="19" font-weight="500">Reusable knowledge</text><text x="22" y="114" fill="#535353" font-size="13"><tspan x="22">Agent knowledge package</tspan><tspan x="22" dy="21">LLM document · Skills</tspan></text><line x1="22" y1="178" x2="278" y2="178" stroke="#e5e5e5"/><text x="22" y="207" fill="#d95817" font-family="monospace" font-size="11">inventory-backed build</text></g>
  </g>
  <g transform="translate(48 442)" font-family="Inter, Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect width="1304" height="90" rx="14" fill="#fff4ed" stroke="#f2c4aa"/><text x="24" y="34" fill="#d95817" font-family="monospace" font-size="11">RESUMABLE WORKSPACE</text><text x="24" y="63" fill="#535353" font-size="14">Observable facts select the next legal Route. Source evidence and approved knowledge survive across sessions; conversation memory is never the source of truth.</text></g>
</svg>
