<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Context 知识生产工作流</title>
  <desc id="desc">飞书文档、本地文档、代码仓库和人工资料经过证据采集、Agent 语义整理、审核验证，成为 Agent 或 LLM 可消费的知识产物。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d5d5d5" opacity=".45"/></pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#181818" flood-opacity=".075"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#ef6f2e"/></marker>
  </defs>
  <rect width="1400" height="600" fill="#faf9f7"/><rect width="1400" height="600" fill="url(#grid)"/>
  <text x="48" y="62" fill="#181818" font-family="Inter, Geist, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="600">让来源证据成为 Agent 可复用的知识</text>
  <text x="48" y="92" fill="#717171" font-family="Inter, Geist, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14">Agent 负责语义判断，Context 负责守住生产契约。</text>
  <g fill="none" stroke="#ef6f2e" stroke-width="2" marker-end="url(#arrow)"><path d="M278 267H308"/><path d="M526 267H556"/><path d="M774 267H804"/><path d="M1022 267H1052"/></g>
  <g filter="url(#lift)" font-family="Inter, Geist, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(48 150)"><rect width="230" height="234" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><rect x="1" y="1" width="228" height="5" rx="3" fill="#ef6f2e"/><text x="22" y="43" fill="#d95817" font-family="monospace" font-size="11">SOURCES</text><text x="22" y="79" fill="#181818" font-size="19" font-weight="500">来源资料</text><text x="22" y="114" fill="#535353" font-size="13"><tspan x="22">飞书 · Markdown</tspan><tspan x="22" dy="21">代码仓库 · 人工资料</tspan></text><line x1="22" y1="178" x2="208" y2="178" stroke="#e5e5e5"/><text x="22" y="207" fill="#717171" font-family="monospace" font-size="11">确认范围</text></g>
    <g transform="translate(308 150)"><rect width="218" height="234" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><text x="22" y="43" fill="#717171" font-family="monospace" font-size="11">CAPTURE</text><text x="22" y="79" fill="#181818" font-size="19" font-weight="500">证据</text><text x="22" y="114" fill="#535353" font-size="13"><tspan x="22">正文、资源、符号、</tspan><tspan x="22" dy="21">关系和来源指纹</tspan></text><line x1="22" y1="178" x2="196" y2="178" stroke="#e5e5e5"/><text x="22" y="207" fill="#717171" font-family="monospace" font-size="11">可追溯快照</text></g>
    <g transform="translate(556 150)"><rect width="218" height="234" rx="14" fill="#fdfdfd" stroke="#ef6f2e" stroke-width="2"/><text x="22" y="43" fill="#d95817" font-family="monospace" font-size="11">AGENT WORK</text><text x="22" y="79" fill="#181818" font-size="19" font-weight="500">结构与编译</text><text x="22" y="114" fill="#535353" font-size="13"><tspan x="22">理解语义、设计 Node、</tspan><tspan x="22" dy="21">生成 Section 草稿</tspan></text><line x1="22" y1="178" x2="196" y2="178" stroke="#e5e5e5"/><text x="22" y="207" fill="#d95817" font-family="monospace" font-size="11">按 Route 加载上下文</text></g>
    <g transform="translate(804 150)"><rect width="218" height="234" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><text x="22" y="43" fill="#717171" font-family="monospace" font-size="11">GOVERNANCE</text><text x="22" y="79" fill="#181818" font-size="19" font-weight="500">审核与验证</text><text x="22" y="114" fill="#535353" font-size="13"><tspan x="22">确认决定、关闭本轮、</tspan><tspan x="22" dy="21">检查知识质量</tspan></text><line x1="22" y1="178" x2="196" y2="178" stroke="#e5e5e5"/><text x="22" y="207" fill="#717171" font-family="monospace" font-size="11">正式知识</text></g>
    <g transform="translate(1052 150)"><rect width="300" height="234" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><rect x="1" y="1" width="298" height="5" rx="3" fill="#ef6f2e"/><text x="22" y="43" fill="#d95817" font-family="monospace" font-size="11">OUTPUTS</text><text x="22" y="79" fill="#181818" font-size="19" font-weight="500">可复用知识</text><text x="22" y="114" fill="#535353" font-size="13"><tspan x="22">Agent 知识包</tspan><tspan x="22" dy="21">LLM 文档 · Skills</tspan></text><line x1="22" y1="178" x2="278" y2="178" stroke="#e5e5e5"/><text x="22" y="207" fill="#d95817" font-family="monospace" font-size="11">清单驱动构建</text></g>
  </g>
  <g transform="translate(48 442)" font-family="Inter, Geist, 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect width="1304" height="90" rx="14" fill="#fff4ed" stroke="#f2c4aa"/><text x="24" y="34" fill="#d95817" font-family="monospace" font-size="11">可恢复工作区</text><text x="24" y="63" fill="#535353" font-size="14">可观察事实选择下一条合法 Route。来源证据和正式知识跨会话保存，对话记忆不充当事实来源。</text></g>
</svg>
