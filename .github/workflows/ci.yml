name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # All parser binaries needed by tests are shipped as WASM assets.
        # Avoid host-specific native rebuilds in the Node compatibility matrix.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build workspace
        run: bun run build

      - name: Verify generated plugin projection
        run: >-
          git diff --exit-code --
          plugins/context/repo-install
          .agents/plugins/marketplace.json
          .claude-plugin/marketplace.json
          .cursor-plugin/marketplace.json

      - name: Report semantic source ownership
        run: bun run report:semantic-source-ownership

      - name: Verify
        run: bun run verify:full
