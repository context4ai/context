name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # All parser binaries needed by tests are shipped as WASM assets.
        # Avoid host-specific native rebuilds in the Node compatibility matrix.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build workspace
        run: bun run build

      - name: Verify generated plugin projection
        run: >-
          git diff --exit-code --
          plugins/context/repo-install
          .agents/plugins/marketplace.json
          .claude-plugin/marketplace.json
          .cursor-plugin/marketplace.json

      # The workspace checks run in Bun, not in the selected Node runtime.
      # Run them once; exercise actual Node consumers on both matrix entries.
      - name: Verify workspace
        if: matrix.node-version == '20'
        run: bun run verify

      - name: Verify Node consumers
        run: |
          bun run test:dist
          node packages/context-cli/dist/cli.js --version
          node packages/context-cli/dist/cli.js --help
          node --input-type=module -e 'import { defineProject } from "./packages/context/dist/index.js"; import assert from "node:assert/strict"; assert.equal(typeof defineProject, "function");'

      # These Bun test harnesses spawn Node. Node 20 already ran them above;
      # keep the Node 24 coverage without repeating the whole Bun suite.
      - name: Verify Node-backed integration tests
        if: matrix.node-version == '24'
        run: >-
          bun test
          packages/context-cli/src/__tests__/projectKnowledgeSearchScript.test.ts
          packages/dev-cli/src/__tests__/contextCliDistribution.integration.test.ts
