name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish packages
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # Release artifacts use committed/generated WASM assets and do not
        # require dependency lifecycle scripts on the runner.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify release version
        run: |
          package_version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Build workspace
        run: bun run build

      - name: Verify repository
        run: bun run verify:full

      - name: Prepare publish artifacts
        run: bun run release:prepare

      - name: Prepare release metadata
        run: |
          mkdir -p .tmp
          bun run scripts/release-metadata.ts --format directories > .tmp/release-package-dirs.txt
          test -s .tmp/release-package-dirs.txt

      - name: Audit npm packages
        run: |
          while IFS= read -r package_dir
          do
            npm pack "${package_dir}" --dry-run --json >/dev/null
          done < .tmp/release-package-dirs.txt

      - name: Publish packages
        run: |
          while IFS= read -r package_dir
          do
            package_name="$(node --input-type=module -e "import pkg from './${package_dir}/package.json' with { type: 'json' }; process.stdout.write(pkg.name)")"
            package_version="$(node --input-type=module -e "import pkg from './${package_dir}/package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping"
            else
              npm publish "${package_dir}" --access public --provenance
            fi
          done < .tmp/release-package-dirs.txt

      - name: Update release package list
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .body > .tmp/release-body.md
          bun run scripts/release-metadata.ts \
            --format markdown \
            --body .tmp/release-body.md \
            > .tmp/release-body-updated.md
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F body=@.tmp/release-body-updated.md \
            >/dev/null
