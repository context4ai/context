name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish packages
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version
        run: |
          package_version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Build workspace
        run: bun run build

      - name: Verify repository
        run: bun run verify:full

      - name: Prepare publish artifacts
        run: bun run release:prepare

      - name: Audit npm packages
        run: |
          for package_dir in \
            packages/core/dist \
            packages/context/dist \
            packages/extract/dist \
            packages/extract-ts/dist \
            packages/extract-go/dist \
            packages/extract-rush/dist \
            packages/context-cli/dist
          do
            npm pack "${package_dir}" --dry-run --json >/dev/null
          done

      - name: Publish packages
        run: |
          for package_dir in \
            packages/core/dist \
            packages/context/dist \
            packages/extract/dist \
            packages/extract-ts/dist \
            packages/extract-go/dist \
            packages/extract-rush/dist \
            packages/context-cli/dist
          do
            package_name="$(node --input-type=module -e "import pkg from './${package_dir}/package.json' with { type: 'json' }; process.stdout.write(pkg.name)")"
            package_version="$(node --input-type=module -e "import pkg from './${package_dir}/package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping"
            else
              npm publish "${package_dir}" --access public --provenance
            fi
          done
