name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to publish
        required: true
        type: string
      skip_checks:
        description: Skip pre/post-release verification (build and publication checks still run)
        default: false
        type: boolean

concurrency:
  group: npm-publish-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release-inputs:
    name: Resolve release parameters
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      id: ${{ steps.release.outputs.id }}
      skip_checks: ${{ steps.release.outputs.skip_checks }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          SKIP_CHECKS: ${{ inputs.skip_checks || contains(github.event.release.body, '<!-- context-release:skip-checks=true -->') }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|preview|rc)\.[0-9]+)?$ ]]
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "skip_checks=${SKIP_CHECKS}" >> "$GITHUB_OUTPUT"
          echo "Release ${RELEASE_TAG}; skip_checks=${SKIP_CHECKS}" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: release-inputs
    if: needs.release-inputs.outputs.skip_checks != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-full.yml
    with:
      ref: ${{ needs.release-inputs.outputs.tag }}
      full: false

  post-release-full:
    name: Post-release full verification
    needs: [release-inputs, publish]
    if: needs.release-inputs.outputs.skip_checks != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-full.yml
    with:
      ref: ${{ needs.release-inputs.outputs.tag }}

  publish:
    needs: [release-inputs, verify]
    name: Publish packages
    if: always() && needs.release-inputs.result == 'success' && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.release-inputs.outputs.skip_checks == 'true'))
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-inputs.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # Release artifacts use committed/generated WASM assets and do not
        # require dependency lifecycle scripts on the runner.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ needs.release-inputs.outputs.tag }}
        run: |
          package_version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          test "${RELEASE_TAG}" = "v${package_version}"

      - name: Capture pre-publish registry state
        run: |
          bun run scripts/release-registry-snapshot.ts \
            --registry https://registry.npmjs.org \
            --receipt .tmp/release-registry-snapshot.json

      - name: Preserve pre-publish registry state
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-preflight-${{ needs.release-inputs.outputs.tag }}
          path: .tmp/release-registry-snapshot.json
          if-no-files-found: error

      - name: Normalize release title
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-inputs.outputs.id }}
          RELEASE_TAG: ${{ needs.release-inputs.outputs.tag }}
        run: |
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f name="${RELEASE_TAG}" \
            >/dev/null

      - name: Build workspace
        run: bun run build

      - name: Prepare publish artifacts
        run: bun run release:prepare

      - name: Prepare release metadata
        id: release-metadata
        run: |
          mkdir -p .tmp
          bun run scripts/release-metadata.ts --format directories > .tmp/release-package-dirs.txt
          bun run scripts/release-metadata.ts --format publish-plan > .tmp/release-publish-plan.json
          test -s .tmp/release-package-dirs.txt
          publish_tag="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const plan = JSON.parse(readFileSync('.tmp/release-publish-plan.json', 'utf8')); process.stdout.write(plan.publish_tag)")"
          test -n "${publish_tag}"
          echo "publish_tag=${publish_tag}" >> "${GITHUB_OUTPUT}"

      - name: Audit npm packages
        run: |
          while IFS= read -r package_dir
          do
            npm pack "${package_dir}" --dry-run --json >/dev/null
          done < .tmp/release-package-dirs.txt

      - name: Publish packages
        run: |
          while IFS= read -r package_dir
          do
            package_name="$(node --input-type=module -e "import pkg from './${package_dir}/package.json' with { type: 'json' }; process.stdout.write(pkg.name)")"
            package_version="$(node --input-type=module -e "import pkg from './${package_dir}/package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping"
            else
              npm publish "${package_dir}" \
                --access public \
                --provenance \
                --tag "${{ steps.release-metadata.outputs.publish_tag }}"
            fi
          done < .tmp/release-package-dirs.txt

      - name: Preserve release receipts
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-receipts-${{ needs.release-inputs.outputs.tag }}
          path: |
            .tmp/release-publish-plan.json
            .tmp/release-registry-snapshot.json
          if-no-files-found: error

      - name: Update release package list
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-inputs.outputs.id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .body > .tmp/release-body.md
          bun run scripts/release-metadata.ts \
            --format markdown \
            --body .tmp/release-body.md \
            > .tmp/release-body-updated.md
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F body=@.tmp/release-body-updated.md \
            >/dev/null
