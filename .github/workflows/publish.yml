name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to finalize after a post-publish smoke failure
        required: true
        type: string
      preflight_run_id:
        description: Failed release run containing the pre-publish registry snapshot
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish packages
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # Release artifacts use committed/generated WASM assets and do not
        # require dependency lifecycle scripts on the runner.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify release version
        run: |
          package_version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Capture pre-publish registry state
        run: |
          bun run scripts/release-registry-snapshot.ts \
            --registry https://registry.npmjs.org \
            --receipt .tmp/release-registry-snapshot.json

      - name: Preserve pre-publish registry state
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-preflight-${{ github.event.release.tag_name }}
          path: .tmp/release-registry-snapshot.json
          if-no-files-found: error

      - name: Normalize release title
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f name="${RELEASE_TAG}" \
            >/dev/null

      - name: Build workspace
        run: bun run build

      - name: Verify repository
        run: bun run verify:full

      - name: Prepare publish artifacts
        run: bun run release:prepare

      - name: Prepare release metadata
        id: release-metadata
        run: |
          mkdir -p .tmp
          bun run scripts/release-metadata.ts --format directories > .tmp/release-package-dirs.txt
          bun run scripts/release-metadata.ts --format publish-plan > .tmp/release-publish-plan.json
          test -s .tmp/release-package-dirs.txt
          publish_tag="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const plan = JSON.parse(readFileSync('.tmp/release-publish-plan.json', 'utf8')); process.stdout.write(plan.publish_tag)")"
          test -n "${publish_tag}"
          echo "publish_tag=${publish_tag}" >> "${GITHUB_OUTPUT}"

      - name: Audit npm packages
        run: |
          while IFS= read -r package_dir
          do
            npm pack "${package_dir}" --dry-run --json >/dev/null
          done < .tmp/release-package-dirs.txt

      - name: Publish packages
        run: |
          while IFS= read -r package_dir
          do
            package_name="$(node --input-type=module -e "import pkg from './${package_dir}/package.json' with { type: 'json' }; process.stdout.write(pkg.name)")"
            package_version="$(node --input-type=module -e "import pkg from './${package_dir}/package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping"
            else
              npm publish "${package_dir}" \
                --access public \
                --provenance \
                --tag "${{ steps.release-metadata.outputs.publish_tag }}"
            fi
          done < .tmp/release-package-dirs.txt

      - name: Smoke exact registry release
        run: |
          succeeded=false
          for attempt in 1 2 3 4 5 6
          do
            if bun run scripts/release-install-smoke.ts \
              --registry https://registry.npmjs.org \
              --receipt .tmp/release-install-smoke.json
            then
              succeeded=true
              break
            fi
            echo "Exact registry smoke attempt ${attempt} failed; waiting for registry propagation"
            sleep 10
          done
          test "${succeeded}" = true

      - name: Promote final release dist-tags
        run: |
          bun run scripts/promote-release-tags.ts \
            --registry https://registry.npmjs.org \
            --registry-snapshot .tmp/release-registry-snapshot.json \
            --smoke-receipt .tmp/release-install-smoke.json \
            --receipt .tmp/release-dist-tag-promotion.json

      - name: Preserve release receipts
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-receipts-${{ github.event.release.tag_name }}
          path: |
            .tmp/release-publish-plan.json
            .tmp/release-registry-snapshot.json
            .tmp/release-install-smoke.json
            .tmp/release-dist-tag-promotion.json
          if-no-files-found: error

      - name: Update release package list
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .body > .tmp/release-body.md
          bun run scripts/release-metadata.ts \
            --format markdown \
            --body .tmp/release-body.md \
            > .tmp/release-body-updated.md
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F body=@.tmp/release-body-updated.md \
            >/dev/null

  finalize:
    name: Finalize existing release
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify recovery target
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          package_version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          test "${RELEASE_TAG}" = "v${package_version}"

      - name: Download pre-publish registry snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh run download "${PREFLIGHT_RUN_ID}" \
            --name "npm-release-preflight-${RELEASE_TAG}" \
            --dir .tmp/npm-release-preflight
          test -s .tmp/npm-release-preflight/release-registry-snapshot.json

      - name: Verify release smoke regression
        run: bun test packages/dev-cli/src/__tests__/publishContextCli.test.ts

      - name: Smoke exact registry release
        run: |
          bun run scripts/release-install-smoke.ts \
            --registry https://registry.npmjs.org \
            --receipt .tmp/release-install-smoke.json

      - name: Promote final release dist-tags
        run: |
          bun run scripts/promote-release-tags.ts \
            --registry https://registry.npmjs.org \
            --registry-snapshot .tmp/npm-release-preflight/release-registry-snapshot.json \
            --smoke-receipt .tmp/release-install-smoke.json \
            --receipt .tmp/release-dist-tag-promotion.json

      - name: Preserve release receipts
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-receipts-${{ inputs.release_tag }}-finalized
          path: |
            .tmp/npm-release-preflight/release-registry-snapshot.json
            .tmp/release-install-smoke.json
            .tmp/release-dist-tag-promotion.json
          if-no-files-found: error

      - name: Update release package list
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq .body > .tmp/release-body.md
          bun run scripts/release-metadata.ts \
            --format markdown \
            --body .tmp/release-body.md \
            > .tmp/release-body-updated.md
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F body=@.tmp/release-body-updated.md \
            >/dev/null
