name: Feature proposal
description: Propose a new knowledge lifecycle, SDK, extraction, or distribution capability.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or Agent problem cannot be solved by the current behavior?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Concrete use case
      description: Describe the sources, workspace state, expected route, and consumer outcome.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior without embedding private or business-specific content.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds and why they are insufficient.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note any workspace, package, CLI, SDK, workflow, or recovery implications.
